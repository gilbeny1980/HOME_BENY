name: android
on:
  workflow_dispatch:
  push:
    paths: ['android/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK into the site (served by Vercel)
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/benyehuda.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/benyehuda.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build Android APK"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
