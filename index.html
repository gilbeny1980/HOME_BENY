<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>ניהול משימות משפחת בן יהודה</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icon.svg" alt="" width="40" height="40">
    <h1>משפחת בן יהודה</h1>
  </div>
  <button id="notifBtn" class="chip" title="הפעלת תזכורות">🔔 תזכורות</button>
</header>

<main>
  <!-- דשבורד -->
  <section id="tab-home" class="tab active">
    <div class="card clockCard">
      <div id="clock" class="clock">--:--</div>
      <div id="dateLine" class="dateLine"></div>
      <div id="hebLine" class="hebLine"></div>
    </div>
    <div class="card">
      <div class="calHead">
        <button id="nextM" class="icon" aria-label="חודש הבא">‹</button>
        <h2 id="monthLabel"></h2>
        <button id="prevM" class="icon" aria-label="חודש קודם">›</button>
      </div>
      <div class="grid dow"><span>א</span><span>ב</span><span>ג</span><span>ד</span><span>ה</span><span>ו</span><span>ש</span></div>
      <div class="grid days" id="days"></div>
      <button id="goToday" class="chip">היום</button>
    </div>
    <h3 id="selLabel" class="sec"></h3>
    <ul id="eventList" class="list"></ul>
    <details class="card">
      <summary class="btn gold">＋ אירוע חדש</summary>
      <form id="eventForm" class="form" style="margin-top:12px">
        <input name="title" placeholder="אירוע חדש (למשל: חוג ריקוד)" required>
        <div class="row">
          <input name="date" type="date" required>
          <input name="time" type="time" value="18:00">
        </div>
        <label class="lbl">עבור
          <select name="kid" id="kidSel"></select>
        </label>
        <label class="lbl">תזכורת
          <select name="remind">
            <option value="-1">ללא</option><option value="0">בזמן האירוע</option>
            <option value="15">15 דקות לפני</option><option value="60" selected>שעה לפני</option>
            <option value="180">3 שעות לפני</option><option value="1440">יום לפני</option>
          </select>
        </label>
        <button class="btn">＋ הוסף ללוח</button>
      </form>
    </details>
  </section>

  <!-- אנשי קשר -->
  <section id="tab-contacts" class="tab">
    <input id="search" class="search" placeholder="🔍 חיפוש איש קשר…">
    <ul id="contactList" class="list"></ul>
    <form id="contactForm" class="card form">
      <h3>איש קשר חדש</h3>
      <input name="name" placeholder="שם" required>
      <input name="phone" type="tel" placeholder="טלפון" dir="ltr">
      <input name="email" type="email" placeholder="אימייל" dir="ltr">
      <input name="address" placeholder="כתובת (עיר, רחוב ומספר)">
      <input name="note" placeholder="הערה קצרה (קשר משפחתי…)">
      <div class="lbl">שייך לילדות (אפשר כמה)</div>
      <div id="kidChecks" class="checks"></div>
      <button class="btn">＋ שמור</button>
    </form>
  </section>

  <!-- הערות -->
  <section id="tab-notes" class="tab">
    <form id="noteForm" class="card form">
      <input name="title" placeholder="כותרת (למשל: חניה אצל סבתא)" required>
      <textarea name="text" rows="4" placeholder="הסבר על המיקום, קוד כניסה, קומה, דירה…"></textarea>
      <select name="contact" id="noteContact"></select>
      <button class="btn">＋ שמור הערה</button>
    </form>
    <ul id="noteList" class="list"></ul>
  </section>

  <!-- ניהול (מוגן בסיסמה) -->
  <section id="tab-admin" class="tab">
    <form id="loginForm" class="card form">
      <h3>🔐 ניהול משימות</h3>
      <p class="mut">הכנס סיסמת ניהול כדי לראות ולערוך משימות.</p>
      <input name="pw" type="password" placeholder="סיסמה" autocomplete="current-password" required>
      <button class="btn">כניסה</button>
      <button type="button" id="forgotBtn" class="linkBtn">שכחתי סיסמה – שלח קוד למייל</button>
    </form>
    <form id="otpForm" class="card form" hidden>
      <h3>קוד חד־פעמי</h3>
      <p class="mut">שלחנו קוד בן 6 ספרות למייל של המנהל. הוא תקף 10 דקות.</p>
      <input name="code" inputmode="numeric" maxlength="6" placeholder="______" dir="ltr" required autocomplete="one-time-code">
      <button class="btn">אישור</button>
    </form>
    <div id="adminBody" hidden>
      <div class="adminBar"><h3>ניהול משימות</h3><button id="lockBtn" class="chip dark">🔒 נעל</button></div>
      <form id="taskForm" class="card form">
        <input name="title" placeholder="משימה חדשה…" required>
        <div class="row">
          <select name="who" id="whoSel"></select>
          <input name="due" type="date">
        </div>
        <button class="btn">＋ הוסף משימה</button>
      </form>
      <div class="filters" id="taskFilters">
        <button data-f="open" class="on">פתוחות</button><button data-f="done">הושלמו</button><button data-f="all">הכל</button>
      </div>
      <ul id="taskList" class="list"></ul>
    </div>
  </section>
</main>

<div class="kids" id="kids"></div>

<nav class="tabs">
  <button data-t="home" class="on"><span>🏠</span>בית</button>
  <button data-t="contacts"><span>👥</span>אנשי קשר</button>
  <button data-t="notes"><span>📝</span>הערות</button>
  <button data-t="admin"><span>🔐</span>ניהול</button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheetBox"><h3 id="sheetTitle"></h3><div id="sheetBody"></div><button class="btn ghost" id="sheetClose">סגור</button></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
